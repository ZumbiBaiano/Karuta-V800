[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karuta"
version = "0.1.0"
description = "Bot de pick automatizado para o Karuta (Discord) usando 3 contas em paralelo"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "typer>=0.12",
    "rich>=13.7",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
karuta = "karuta.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# A pagina do painel mora em src/karuta/web; sem isto um install nao-editavel
# instalaria o painel.py sem o HTML/CSS/JS.
[tool.setuptools.package-data]
karuta = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
